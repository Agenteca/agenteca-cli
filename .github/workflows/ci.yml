name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agenteca-core
          path: agenteca-core
      - uses: actions/checkout@v4
        with:
          path: agenteca-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Agenteca repositories are linked through an npm workspace, as in development.
      - name: Workspace
        run: |
          echo '{"private": true, "workspaces": ["agenteca-core", "agenteca-cli"]}' > package.json
          npm install --no-audit --no-fund
      - name: Build agenteca-core
        run: npm run build -w agenteca-core
      - name: Lint
        run: npm run lint
        working-directory: agenteca-cli
      - name: Types
        run: npm run typecheck
        working-directory: agenteca-cli
      - name: Tests
        run: npm test
        working-directory: agenteca-cli
      - name: Build
        run: npm run build
        working-directory: agenteca-cli

  interop:
    # Interoperability with the reference tool apm, pinned version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agenteca-core
          path: agenteca-core
      - uses: actions/checkout@v4
        with:
          path: agenteca-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install apm-cli==0.35.0
      - name: Workspace
        run: |
          echo '{"private":true,"workspaces":["agenteca-core","agenteca-cli"]}' > package.json
          npm install --no-audit --no-fund
          npm run build -w agenteca-core
      - name: Interoperability tests
        run: AHUB_INTEROP_APM=$GITHUB_WORKSPACE/.venv/bin/apm npx vitest run test/interop.test.ts
        working-directory: agenteca-cli
